[project]
name = "moon_survey"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "rfnry-engine[postgres]",
    "asyncpg",
    "fastapi",
    "uvicorn",
    "httpx",
    "numpy",
    "anthropic",
    "openai",
    "pyyaml",
]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-engine = { path = "../../packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = [
    "moon",
    "setup",
    "store",
    "board",
    "tools",
    "sandbox",
    "merge",
    "providers",
    "fakes",
    "measure",
    "harness",
    "routes",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]
markers = ["live: runs a real model"]
