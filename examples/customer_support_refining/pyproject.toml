[project]
name = "customer_support_refining"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "rfnry-engine",
    "anthropic",
    "httpx",
    "datasets>=4.7",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-engine = { path = "../../packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["providers"]
known-third-party = ["datasets"]
