[project]
name = "decision_on_open_weights"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "rfnry-engine",
    "rfnry-memory",
    "httpx",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-engine = { path = "../../packages/python", editable = true }
rfnry-memory = { path = "../../../memory/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["harness", "providers"]
