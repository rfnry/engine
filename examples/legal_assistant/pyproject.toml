[project]
name = "legal_assistant"
version = "0"
requires-python = ">=3.14"
dependencies = [
    "rfnry-engine[postgres]",
    "anthropic",
    "fastapi",
    "uvicorn",
    "websockets",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.uv.sources]
rfnry-engine = { path = "../../packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["chat", "harness", "providers", "routes", "thinking", "utils"]
