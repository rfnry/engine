version: 1
models:
  strong:
    provider: strong
  judge:
    provider: judge
tools:
  lookup_order:
    module: support/tools/lookup_order.py
    schema: support/tools/lookup_order.json
  now:
    module: support/tools/now.py
    schema: support/tools/now.json
agents:
  billing:
    kind: generation
    model: strong
    description: Answers billing questions
    instructions: billing/instructions.md
    files:
      include:
        - billing
  frontdesk:
    kind: decision
    model: judge
    description: Routes an incoming message
    instructions: frontdesk/instructions.md
    questions:
      - frontdesk/questions/*.json
    orchestration:
      route:
        by: intent
        to:
          billing: billing
          technical: support
        min_confidence: 0.6
  judge:
    kind: decision
    model: judge
    description: Judges an episode
    instructions: judge/instructions.md
    questions:
      - judge/questions/*.json
  support:
    kind: generation
    model: strong
    description: Handles technical support conversations
    instructions: support/instructions.md
    files:
      include:
        - support/knowledge
        - support/rules
    skills:
      include:
        - support/skills/*
    tools:
      include:
        - lookup_order
        - now
    orchestration:
      delegate_to:
        - triage
  teacher:
    kind: generation
    model: strong
    description: Answers decision questions with a rationale
    instructions: teacher/instructions.md
  triage:
    kind: decision
    model: judge
    description: Judges urgency and severity of a message
    instructions: triage/instructions.md
    questions:
      - triage/questions/*.json
